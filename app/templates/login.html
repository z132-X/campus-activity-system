{% extends 'base.html' %}
{% block title %}登录{% endblock %}
{% block content %}
<h2>登录</h2>
<form method="post" class="form">
  <label>账号<input name="username" required autofocus></label>
  <label>密码<input type="password" name="password" required></label>
  <button type="submit">登录</button>
</form>
<p class="hint">还没有账号？<a href="{{ url_for('auth.register') }}">注册</a></p>
{% endblock %}
