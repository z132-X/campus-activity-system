{% extends 'base.html' %}
{% block title %}注册{% endblock %}
{% block content %}
<h2>注册</h2>
<form method="post" class="form">
  <label>账号<input name="username" required autofocus></label>
  <label>姓名<input name="display_name" required></label>
  <label>密码（至少 6 位）<input type="password" name="password" required></label>
  <label>身份
    <select name="role" required>
      <option value="student">学生</option>
      <option value="teacher">活动组织教师</option>
    </select>
  </label>
  <button type="submit">注册</button>
</form>
<p class="hint">已有账号？<a href="{{ url_for('auth.login') }}">登录</a></p>
{% endblock %}
